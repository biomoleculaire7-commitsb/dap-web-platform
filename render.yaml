services:
  - type: web
    name: dap-web-platform
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DAP_DATA
        value: "/tmp/dap_data"
      - key: DAP_MODEL
        value: "exp.tflite"
