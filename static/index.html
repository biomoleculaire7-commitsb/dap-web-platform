<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAP — Diagnostic Automatique des Parasites</title>
<style>
:root{--bg:#f4f7fb;--c:#fff;--t:#14213d;--m:#64748b;--p:#0f766e;--p2:#0d9488;--b:#e2e8f0;--r:#dc2626;--o:#d97706;--g:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--c:#131c2e;--t:#e6edf7;--m:#94a3b8;--b:#25314a}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--p);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header b{font-size:20px;letter-spacing:1px}header a{color:#d1fae5;text-decoration:none;cursor:pointer;padding:6px 10px;border-radius:6px}header a:hover,header a.on{background:#ffffff26;color:#fff}
header .sp{flex:1}main{max-width:1100px;margin:24px auto;padding:0 16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.kpi b{font-size:28px;display:block;color:var(--p2)}.kpi span{color:var(--m)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--m)}button{background:var(--p2);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit}button.s{background:var(--b);color:var(--t)}button.r{background:var(--r)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b);vertical-align:top}th{color:var(--m);font-weight:600;font-size:13px}tr.k{cursor:pointer}tr.k:hover{background:var(--bg)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--b);margin:1px}.confirmed,.expertisé{background:#bbf7d0;color:#14532d}.rejected{background:#fecaca;color:#7f1d1d}.auto,.en_attente{background:#fde68a;color:#78350f}
.imgs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.imgs img{width:100%;border-radius:8px;border:1px solid var(--b)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}h2{margin:0 0 12px}.m{color:var(--m)}#err{color:var(--r);margin:8px 0}
.bar{height:10px;background:var(--p2);border-radius:5px}
.btn{display:inline-block;background:var(--p2);color:#fff;text-decoration:none;border-radius:8px;padding:9px 16px}
.acq{display:grid;grid-template-columns:200px 1fr;gap:14px}@media(max-width:640px){.acq{grid-template-columns:1fr}}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--p2);border-radius:14px;min-height:170px;cursor:pointer;color:var(--t);text-align:center;padding:10px}.pick:hover{background:var(--bg)}.ico{font-size:44px}
.rsbox{border:1px solid var(--b);border-radius:14px;min-height:170px;padding:10px;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}.rsbox img,.rsbox video{max-width:100%;max-height:260px;border-radius:8px}
#md{position:fixed;inset:0;background:#000c;z-index:50;overflow:auto;padding:14px}#md .in{background:var(--c);border-radius:12px;padding:14px;max-width:1300px;margin:auto;display:flex;gap:14px;flex-wrap:wrap}#cv{border-radius:8px;cursor:crosshair;touch-action:none;max-width:100%}
#md .side{flex:1;min-width:280px}#md .bx{display:flex;gap:6px;align-items:center;margin:4px 0}#md .bx select{margin:0}
</style></head><body><div id="app"></div><script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);const API=(window.DAP_API||'').replace(/\/$/,'');let CASE=null,AN={},CL=null,T=null,ME=null,ROLE=localStorage.dapRole||'lab';localStorage.removeItem('dap');
async function api(p,o={}){const h={'X-Demo-Role':ROLE};if(T)h.Authorization='Bearer '+T;let b=o.body;if(b&&!(b instanceof FormData)){h['Content-Type']='application/json';b=JSON.stringify(b)}
 let r;try{r=await fetch(API+'/api'+p,{method:o.method||(b?'POST':'GET'),headers:h,body:b})}catch(e){err('Serveur injoignable. Vérifiez web/config.js (adresse du serveur Render) et la variable DAP_ORIGINS sur Render.');throw 0}if(r.status==401&&p!='/login'){T=null;V.login();throw 0}
 const j=await r.json().catch(()=>({detail:'Erreur serveur '+r.status}));if(!r.ok){err(j.detail||'Erreur');throw 0}return j}
const err=m=>{m=typeof m=='string'?m:JSON.stringify(m);const e=$('#err');if(e)e.textContent=m;else $('#app').innerHTML='<main><div class=card><h2>Erreur</h2><p style="color:var(--r)">'+E(m)+'</p><p class=m>API utilisée : '+E(API||location.origin)+'</p></div></main>'};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=t=>t?new Date(t*1000).toLocaleString('fr-DZ'):'';const tag=s=>`<span class="tag ${s}">${E(({confirmed:'confirmé',rejected:'infirmé',auto:'IA (non confirmé)'})[s]||s)}</span>`;
const F=id=>`${API}/api/files/${id}?t=${T||''}&r=${ROLE}`;
function swRole(){ROLE=ROLE=='expert'?'lab':'expert';localStorage.dapRole=ROLE;boot()}
function logout(){localStorage.removeItem('dap');T=null;ME=null;go('login')}
function shell(h,on){$('#app').innerHTML=`<header><b>DAP</b>${[['dash','Tableau de bord'],['cases','Dossiers'],['new','Nouveau dossier'],['inbox','Expertises reçues'],['db','Base parasites'],['team','Laboratoire']].map(([k,l])=>`<a class="${on==k?'on':''}" onclick="go('${k}')">${l}</a>`).join('')}<span class="sp"></span><span>${E(ME.lab_name)} · ${E(ME.name)}</span><a onclick="swRole()">Mode démo : passer en ${ROLE=='expert'?'Laboratoire':'Expert'}</a></header><main><div id="err"></div>${h}</main>`}
async function go(v,id){location.hash=v+(id?'/'+id:'');await V[v](id)}
const V={
async login(){$('#app').innerHTML=`<main style="max-width:420px"><div class="card"><h2>DAP — Connexion</h2><label>E-mail</label><input id=e><label>Mot de passe</label><input id=p type=password><div id=err></div><button onclick="doLogin()">Se connecter</button> <button class=s onclick="V.reg()">Inscrire mon laboratoire</button></div></main>`},
reg(){$('#app').innerHTML=`<main style="max-width:620px"><div class="card"><h2>Inscription d'un laboratoire / hôpital</h2><div class=row><div><label>Nom de l'établissement</label><input id=ln></div><div><label>Type</label><select id=lt><option>Laboratoire</option><option>Hôpital</option><option>Clinique</option><option>Centre de santé</option></select></div></div><div class=row><div><label>Wilaya</label><input id=lw></div><div><label>Téléphone</label><input id=lp></div></div><label>Adresse</label><input id=la><label><input type=checkbox id=lx style="width:auto"> Mon établissement dispose d'un expert pouvant confirmer les diagnostics d'autres établissements</label><h3>Compte administrateur</h3><div class=row><div><label>Nom</label><input id=un></div><div><label>E-mail</label><input id=ue></div><div><label>Mot de passe</label><input id=up type=password></div></div><div id=err></div><button onclick="doReg()">Créer</button> <button class=s onclick="V.login()">Retour</button></div></main>`},
async dash(){const s=await api('/stats'),m=Math.max(1,...s.by_parasite.map(x=>x.n));shell(`<div class=grid><div class="card kpi"><b>${s.cases}</b><span>Dossiers</span></div><div class="card kpi"><b>${s.pending_out}</b><span>Expertises en attente</span></div><div class="card kpi"><b>${s.inbox}</b><span>À expertiser (reçues)</span></div><div class="card kpi"><b>${s.confirmed}</b><span>Parasites confirmés</span></div></div><div class=card><h2>Parasites confirmés par un expert (réseau)</h2>${s.by_parasite.map(x=>`<div class=row style="align-items:center;margin:4px 0"><div style="flex:0 0 240px">${E(x.parasite)}</div><div><div class=bar style="width:${x.n/m*100}%"></div></div><div style="flex:0 0 40px">${x.n}</div></div>`).join('')||'<span class=m>Aucune donnée confirmée pour le moment.</span>'}</div>`,'dash')},
async cases(){const c=await api('/cases');shell(`<div class=card><h2>Dossiers</h2><table><tr><th>N°</th><th>Patient</th><th>Prélèvement</th><th>Parasites détectés</th><th>Statut</th><th>Date</th></tr>${c.map(x=>`<tr class=k onclick="go('case',${x.id})"><td>${x.id}</td><td>${E(x.patient_ref)} ${x.received?'<span class=tag>reçu</span>':''}</td><td>${E(x.sample_type)}</td><td>${(x.parasites||'—').split(',').map(p=>`<span class=tag>${E(p)}</span>`).join('')}</td><td>${tag(x.status.replace(/ /g,'_'))}</td><td>${D(x.created)}</td></tr>`).join('')}</table></div>`,'cases')},
async new(){shell(`<div class=card><h2>Nouveau dossier patient</h2><div class=row><div><label>Référence / nom du patient</label><input id=pr></div><div><label>Âge</label><input id=pa></div><div><label>Sexe</label><select id=ps><option>M</option><option>F</option></select></div></div><label>Type de prélèvement</label><input id=pt value="Selles"><label>Notes cliniques</label><textarea id=pn rows=3></textarea><div id=err></div><button onclick="mk()">Créer le dossier</button></div>`,'new')},
async case(id){const d=await api('/cases/'+id);CASE=d;const c=d.case,labs=d.own?await api('/labs'):[];const ann=d.files.filter(f=>f.kind=='annotée'),orig=d.files.filter(f=>f.kind!='annotée'),isX=ME.role!='tech';
 shell(`<div class=card><h2>Dossier #${c.id} — ${E(c.patient_ref)} ${tag(c.status.replace(/ /g,'_'))}</h2><div class=m>${E(c.age)} ans · ${E(c.sex)} · ${E(c.sample_type)} · ${D(c.created)}</div><p>${E(c.notes)}</p>
 <a class=btn href="${API}/api/cases/${id}/report.pdf?t=${T||''}&r=${ROLE}" target=_blank>📄 Exporter le rapport PDF</a>
 <p>${orig.map(f=>f.kind=='doc'?`<a class=tag href="${F(f.id)}">📄 ${E(f.name)}</a>`:`<span class=tag>${f.kind=='video'?'🎞':'🖼'} ${E(f.name)}</span>`).join('')}</p></div>
 ${d.own?`<div class=card><h2>1. Acquisition et analyse</h2><div class=acq>
  <label class=pick for=fl><span class=ico>📷</span><b>Importer</b><span class=m>image · vidéo · document</span></label><input type=file id=fl multiple hidden onchange="prev()">
  <div id=rs class=rsbox>${ann.length?`<div class=imgs>${ann.map(f=>`<div><img src="${F(f.id)}" loading=lazy><div class=m>${E(f.name)}</div></div>`).join('')}</div>`:'<span class=m>L\'aperçu et le résultat de la détection s\'affichent ici</span>'}</div></div>
  <div style="margin-top:12px"><button id=bt onclick="up(${id})">🔬 Analyser</button> <span id=ld class=m></span></div></div>`:`<div class=card><h2>Résultats de l'IA</h2><div class=imgs>${ann.map(f=>`<div><img src="${F(f.id)}" loading=lazy><div class=m>${E(f.name)}</div></div>`).join('')||'<span class=m>Aucune image.</span>'}</div></div>`}
 ${isX?`<div class=card><h2>👨‍⚕️ Espace expert</h2><p class=m>Confirmez ou infirmez les détections, corrigez/ajoutez des parasites sur l'image (alimente la base d'entraînement), puis exportez le rapport.</p>
  <div class=imgs>${ann.map(f=>`<div><img src="${F(f.id)}" loading=lazy onclick="openAnn(${f.id})" style="cursor:pointer"><div class=m>${E(f.name)}</div>${d.findings.filter(x=>x.file_id==f.id).map(x=>`<div>${tag(x.status)} ${E(x.parasite)} (${(x.conf*100).toFixed(0)}%)${d.can_review?` <label><input type=radio name="f${x.id}" value=confirmed checked style="width:auto">confirmer</label> <label><input type=radio name="f${x.id}" value=rejected style="width:auto">infirmer</label>`:''}</div>`).join('')}<button class=s onclick="openAnn(${f.id})" style="margin-top:6px">✏️ Annoter / corriger</button></div>`).join('')||'<span class=m>Aucune image analysée.</span>'}</div>
  ${d.can_review?`<h3>Rapport d'expertise</h3><label>Conclusion</label><input id=vd placeholder="ex. Ascaris lumbricoides confirmé"><label>Rapport détaillé</label><textarea id=rp rows=5></textarea><button onclick="rep(${d.referrals.find(r=>r.status=='en_attente'&&r.to_lab==ME.lab_id).id},${id})">Envoyer le rapport au laboratoire demandeur</button>`:''}</div>`:''}
 ${d.own?`<div class=card><h2>Envoyer pour expertise</h2><div class=row><select id=tl>${labs.map(l=>`<option value=${l.id}>${E(l.name)} — ${E(l.wilaya)}</option>`).join('')}</select><input id=tm placeholder="Message pour l'expert"></div>${labs.length?`<button onclick="snd(${id})">Envoyer le dossier complet</button>`:'<span class=m>Aucun établissement avec expert inscrit.</span>'}</div>`:''}
 <div class=card><h2>Expertises</h2>${d.referrals.map(r=>`<div style="border-bottom:1px solid var(--b);padding:8px 0">${E(r.from_name)} → <b>${E(r.to_name)}</b> ${tag(r.status)} <span class=m>${D(r.sent_at)}</span><div class=m>${E(r.message)}</div>${r.report?`<div><b>${E(r.verdict)}</b><br>${E(r.report).replace(/\n/g,'<br>')}<div class=m>${D(r.reviewed_at)}</div></div>`:''}</div>`).join('')||'<span class=m>Aucune.</span>'}</div>`,'cases')},
async inbox(){const c=(await api('/cases')).filter(x=>x.received);shell(`<div class=card><h2>Dossiers reçus pour expertise</h2><table><tr><th>N°</th><th>Patient</th><th>Statut</th><th>Reçu</th></tr>${c.map(x=>`<tr class=k onclick="go('case',${x.id})"><td>${x.id}</td><td>${E(x.patient_ref)}</td><td>${tag(x.status.replace(/ /g,'_'))}</td><td>${D(x.created)}</td></tr>`).join('')}</table></div>`,'inbox')},
async db(){const p=$('#fp')?.value||'',s=$('#fs')?.value||'confirmed',r=await api(`/database?status=${s}&parasite=${encodeURIComponent(p)}`);const L=r.length?[...new Set(r.map(x=>x.parasite))]:[];
 const ds=await api('/dataset/stats');shell(`${ME.role!='tech'?`<div class=card><h2>🧠 Base d'entraînement (annotations de l'expert)</h2><div class=m>${ds.images} images · ${ds.boxes} annotations${ds.by_class.length?' — '+ds.by_class.slice(0,6).map(x=>E(x.label)+' ('+x.n+')').join(', '):''}</div><p><a class=btn href="${API}/api/dataset.zip?t=${T||''}&r=${ROLE}">⬇ Télécharger le dataset (format YOLO)</a></p></div>`:''}<div class=card><h2>Base de données des parasites</h2><div class=row><div><label>Statut</label><select id=fs onchange="V.db()"><option value=confirmed>Confirmés par expert</option><option value=auto>Détectés par IA (mon labo)</option><option value=all>Tous (mon labo + confirmés)</option></select></div><div><label>Parasite</label><input id=fp value="${E(p)}" placeholder="filtrer…" onchange="V.db()"></div></div><table><tr><th>Parasite</th><th>Confiance</th><th>Statut</th><th>Établissement</th><th>Patient</th><th>Expert</th><th>Image</th></tr>${r.map(x=>`<tr><td>${E(x.parasite)}</td><td>${(x.conf*100).toFixed(0)}%</td><td>${tag(x.status)}</td><td>${E(x.lab)}</td><td>${E(x.patient_ref||'(anonymisé)')} ${E(x.age)} ${E(x.sex)}</td><td>${E(x.expert||'')}</td><td>${x.patient_ref!==null?`<a href="${F(x.file_id)}" target=_blank>voir</a>`:''}</td></tr>`).join('')}</table></div>`,'db');$('#fs').value=s}};
V.team=async()=>{shell(`<div class=card><h2>${E(ME.lab_name)}</h2>${ME.role=='admin'?`<h3>Ajouter un utilisateur</h3><div class=row><input id=nn placeholder=Nom><input id=ne placeholder=E-mail><input id=np type=password placeholder="Mot de passe"><select id=nr><option value=tech>Technicien</option><option value=expert>Expert</option></select></div><button onclick="au()">Ajouter</button>`:'<span class=m>Réservé à l\'administrateur.</span>'}</div>`,'team')};
const v=id=>$(id).value;
async function doLogin(){try{const r=await api('/login',{body:{email:v('#e'),password:v('#p')}});T=r.token;localStorage.dap=T;boot()}catch(e){}}
async function doReg(){try{const r=await api('/register',{body:{lab_name:v('#ln'),type:v('#lt'),wilaya:v('#lw'),phone:v('#lp'),address:v('#la'),has_expert:$('#lx').checked,name:v('#un'),email:v('#ue'),password:v('#up')}});T=r.token;localStorage.dap=T;boot()}catch(e){}}
async function mk(){try{const r=await api('/cases',{body:{patient_ref:v('#pr'),age:v('#pa'),sex:v('#ps'),sample_type:v('#pt'),notes:v('#pn')}});go('case',r.id)}catch(e){}}
async function up(id){if(!$('#fl').files.length){err('Choisissez au moins un fichier');return}const f=new FormData();[...$('#fl').files].forEach(x=>f.append('files',x));$('#ld').textContent='Analyse en cours…';try{await api(`/cases/${id}/files`,{body:f});go('case',id)}catch(e){$('#ld').textContent=''}}
async function snd(id){try{await api(`/cases/${id}/refer`,{body:{to_lab:+v('#tl'),message:v('#tm')}});go('case',id)}catch(e){}}
async function rep(rid,id){const fs=[...document.querySelectorAll('input[type=radio]:checked')].map(x=>({id:+x.name.slice(1),status:x.value}));try{await api(`/referrals/${rid}/report`,{body:{verdict:v('#vd'),report:v('#rp'),findings:fs}});go('case',id)}catch(e){}}
async function au(){try{await api('/users',{body:{name:v('#nn'),email:v('#ne'),password:v('#np'),role:v('#nr')}});alert('Utilisateur ajouté')}catch(e){}}

function prev(){const b=$('#rs');b.innerHTML='';[...$('#fl').files].forEach(f=>{const u=URL.createObjectURL(f),t=f.type.startsWith('image')?`<img src="${u}">`:f.type.startsWith('video')?`<video src="${u}" muted controls></video>`:`<div style="font-size:30px">📄</div>`;b.insertAdjacentHTML('beforeend',`<div style="text-align:center">${t}<div class=m>${E(f.name)}</div></div>`)})}
const FR=id=>F(id)+'&raw=1';
function opts(sel){const c=CL;const o=a=>a.map(n=>`<option ${n==sel?'selected':''}>${E(n)}</option>`).join('');return `<optgroup label="Modèle DAP (19)">${o(c.model)}</optgroup><optgroup label="Autres parasites des selles">${o(c.extra)}</optgroup><optgroup label="Non parasite / artéfact">${o(c.other)}</optgroup>`}
async function openAnn(fid){if(!CL)CL=await api('/classes');const ex=await api(`/files/${fid}/annotations`);const img=new Image();img.onload=()=>{
 const W=img.naturalWidth,H=img.naturalHeight,s=Math.min(1,Math.min(900,innerWidth-60)/W);
 let bx=ex.map(e=>({label:e.label,x0:e.x0*W,y0:e.y0*H,x1:e.x1*W,y1:e.y1*H}));
 if(!bx.length)bx=CASE.findings.filter(x=>x.file_id==fid&&x.status!='rejected').map(x=>{const b=JSON.parse(x.box);return{label:x.parasite,x0:b[0],y0:b[1],x1:b[2],y1:b[3]}});
 AN={fid,img,W,H,s,bx,sel:-1,drag:null,last:CL.model[0]};
 document.body.insertAdjacentHTML('beforeend',`<div id=md><div class=in><div><canvas id=cv width=${Math.round(W*s)} height=${Math.round(H*s)}></canvas><div class=m>Tracez un rectangle autour du parasite, puis choisissez son nom dans la liste.</div></div><div class=side><h3>Annotations</h3><div id=bl></div><p><button onclick="saveAnn()">💾 Enregistrer dans la base d'entraînement</button> <button class=s onclick="$('#md').remove()">Fermer</button></p><div id=an-err class=m></div></div></div></div>`);
 const cv=$('#cv'),pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width/AN.s,(e.clientY-r.top)*cv.height/r.height/AN.s]};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);AN.drag=pos(e).concat(pos(e))};
 cv.onpointermove=e=>{if(AN.drag){const p=pos(e);AN.drag[2]=p[0];AN.drag[3]=p[1];draw()}};
 cv.onpointerup=e=>{const d=AN.drag;AN.drag=null;if(d&&Math.abs(d[2]-d[0])*AN.s>8&&Math.abs(d[3]-d[1])*AN.s>8){AN.bx.push({label:AN.last,x0:Math.min(d[0],d[2]),y0:Math.min(d[1],d[3]),x1:Math.max(d[0],d[2]),y1:Math.max(d[1],d[3])});AN.sel=AN.bx.length-1}list();draw()};
 list();draw()};img.src=FR(fid)}
function draw(){const cv=$('#cv'),x=cv.getContext('2d'),s=AN.s;x.drawImage(AN.img,0,0,cv.width,cv.height);x.lineWidth=2;x.font='13px sans-serif';
 AN.bx.forEach((b,i)=>{x.strokeStyle=i==AN.sel?'#f59e0b':'#22d3ee';x.strokeRect(b.x0*s,b.y0*s,(b.x1-b.x0)*s,(b.y1-b.y0)*s);x.fillStyle=x.strokeStyle;x.fillText((i+1)+' '+b.label,b.x0*s+2,Math.max(12,b.y0*s-4))});
 if(AN.drag){const d=AN.drag;x.strokeStyle='#f59e0b';x.strokeRect(d[0]*s,d[1]*s,(d[2]-d[0])*s,(d[3]-d[1])*s)}}
function list(){$('#bl').innerHTML=AN.bx.map((b,i)=>`<div class=bx><b>${i+1}</b><select onchange="AN.bx[${i}].label=AN.last=this.value;AN.sel=${i};draw()">${opts(b.label)}</select><button class="s" onclick="AN.bx.splice(${i},1);AN.sel=-1;list();draw()">✕</button></div>`).join('')||'<span class=m>Aucune boîte (image enregistrée comme « sans parasite »).</span>'}
async function saveAnn(){const{W,H}=AN;try{const r=await api(`/files/${AN.fid}/annotations`,{body:{boxes:AN.bx.map(b=>({label:b.label,box:[b.x0/W,b.y0/H,b.x1/W,b.y1/H]}))}});$('#an-err').textContent='✅ Enregistré : '+r.saved+' annotation(s) ajoutée(s) à la base d\'entraînement'}catch(e){}}
