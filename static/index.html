.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.kpi b{font-size:28px;display:block;color:var(--p2)}.kpi span{color:var(--m)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;margin:4px 0 10px}

table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:8px;border-bottom:1px solid var(--b);vertical-align:top}th{color:var(--m);font-weight:600;font-size:13px}tr.k{cursor:pointer}tr.k:hover{background:var(--bg)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--b);margin:1px}.confirmed,.expertisé,.approved,.approve{background:#bbf7d0;color:#14532d}.rejected{background:#fecaca;color:#7f1d1d}.auto,.en_attente,.pending{background:#fde68a;color:#78350f}
.imgs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.imgs img{width:100%;border-radius:8px;border:1px solid var(--b)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}h2{margin:0 0 12px}.m{color:var(--m)}#err{color:var(--r);margin:8px 0}#ok{color:#15803d;margin:8px 0}
.bar{height:10px;background:var(--p2);border-radius:5px}
.btn{display:inline-block;background:var(--p2);color:#fff;text-decoration:none;border-radius:8px;padding:9px 16px}
.acq{display:grid;grid-template-columns:200px 1fr;gap:14px}@media(max-width:640px){.acq{grid-template-columns:1fr}}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--p2);border-radius:14px;min-height:170px;cursor:pointer;color:var(--t);text-align:center;padding:10px}.pick:hover{background:var(--bg)}.ico{font-size:44px}
.rsbox{border:1px solid var(--b);border-radius:14px;min-height:170px;padding:10px;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}.rsbox img,.rsbox video{max-width:100%;max-height:260px;border-radius:8px}

async cases(){const c=await api('/cases');shell(`<div class=card><h2>${t('c_title')}</h2><table><tr><th>N°</th><th>${t('c_ref')}</th><th>${t('c_sample')}</th><th>${t('c_par')}</th><th>${t('c_stat')}</th><th>${t('c_date')}</th></tr>${c.map(x=>`<tr class=k onclick="go('case',${x.id})"><td>${x.id}</td><td>${E(x.patient_ref)} ${x.received?`<span class=tag>${t('received')}</span>`:''}</td><td>${E(x.sample_type)}</td><td>${(x.parasites||'—').split(',').map(p=>`<span class=tag>${E(p)}</span>`).join('')}</td><td>${tag(x.status)}</td><td>${D(x.created)}</td></tr>`).join('')}</table></div>`,'cases')},
async new(){shell(`<div class=card><h2>${t('nw_title')}</h2><div class=row><div><label>${t('nw_ref')}</label><input id=pr></div><div><label>${t('age')}</label><input id=pa></div><div><label>${t('sex')}</label><select id=ps><option>M</option><option>F</option></select></div></div><label>${t('sample')}</label><input id=pt value="Selles"><label>${t('notes')}</label><textarea id=pn rows=3></textarea><div id=err></div><button onclick="mk()">${t('nw_btn')}</button></div>`,'new')},
async case(id){const d=await api('/cases/'+id);CASE=d;const c=d.case,labs=d.own?await api('/labs'):[],ann=d.files.filter(f=>f.kind=='annotée'),orig=d.files.filter(f=>f.kind!='annotée'),isX=!d.own&&ME.has_expert&&['expert','admin'].includes(ME.role),pend=d.referrals.find(r=>r.status=='en_attente'&&r.to_lab==ME.lab_id);
 shell(`<div class=card><h2>${t('dossier')} #${c.id} — ${E(c.patient_ref)} ${tag(c.status)}</h2><div class=m>${E(c.age)} ${t('years')} · ${E(c.sex)} · ${E(c.sample_type)} · ${D(c.created)}</div><p>${E(c.notes)}</p>
 <a class=btn href="${API}/api/cases/${id}/report.pdf?t=${T||''}" target=_blank>📄 ${t('pdf')}</a>
 <p>${orig.map(f=>f.kind=='doc'?`<a class=tag href="${F(f.id)}">📄 ${E(f.name)}</a>`:`<span class=tag>${f.kind=='video'?'🎞':'🖼'} ${E(f.name)}</span>`).join('')}</p></div>
 ${d.own?d.referrals.filter(r=>r.status=='expertisé').map(r=>`<div class=card style="border-color:var(--p2)"><h2>✅ ${t('rep_recv')}</h2><div class=m>${E(r.to_name)}${r.expert_name?' — '+t('by')+' '+E(r.expert_name):''} · ${D(r.reviewed_at)}</div><p><b>${E(r.verdict||'')}</b></p>${(()=>{const n=[...new Set(d.findings.filter(x=>x.status=='confirmed').map(x=>x.parasite))];return n.length?`<p>${t('final_par')} : ${n.map(p=>`<span class=tag>${E(p)}</span>`).join('')}</p>`:''})()}<p>${E(r.report||'').replace(/\n/g,'<br>')||`<span class=m>${t('no_text')}</span>`}</p><a class=btn href="${API}/api/cases/${id}/report.pdf?t=${T||''}" target=_blank>📄 ${t('pdf')}</a></div>`).join(''):''}
 ${d.own?`<div class=card><h2>${t('acq')}</h2><div class=acq>
  <label class=pick for=fl><span class=ico>📷</span><b>${t('imp')}</b><span class=m>${t('imp_sub')}</span></label><input type=file id=fl multiple hidden onchange="prev()">
  <div id=rs class=rsbox>${ann.length?`<div class=imgs>${ann.map(f=>`<div><img src="${F(f.id)}" loading=lazy><div class=m>${E(f.name)}</div></div>`).join('')}</div>`:`<span class=m>${t('hint')}</span>`}</div></div>
  <div style="margin-top:12px"><button id=bt onclick="up(${id})">🔬 ${t('analyze')}</button> <span id=ld class=m></span></div></div>`:`<div class=card><h2>${t('res_ai')}</h2><div class=imgs>${ann.map(f=>`<div><img src="${F(f.id)}" loading=lazy><div class=m>${E(f.name)}</div></div>`).join('')||`<span class=m>${t('no_img')}</span>`}</div></div>`}
 ${isX?`<div class=card><h2>👨‍⚕️ ${t('expert_sp')}</h2><p class=m>${t('expert_help')}</p>
  <div class=imgs>${ann.map(f=>`<div><img src="${F(f.id)}" loading=lazy onclick="openAnn(${f.id})" style="cursor:pointer"><div class=m>${E(f.name)}</div>${d.findings.filter(x=>x.file_id==f.id).map(x=>`<div>${tag(x.status)} ${E(x.parasite)} (${pc(x.conf)})${d.can_review?` <label><input type=radio name="f${x.id}" value=confirmed checked style="width:auto">${t('confirm')}</label> <label><input type=radio name="f${x.id}" value=rejected style="width:auto">${t('reject')}</label>`:''}</div>`).join('')}<button class=s onclick="openAnn(${f.id})" style="margin-top:6px">✏️ ${t('annotate')}</button></div>`).join('')||`<span class=m>${t('no_img')}</span>`}</div>
  ${d.can_review&&pend?`<h3>${t('rep_title')}</h3><label>${t('concl')}</label><input id=vd><label>${t('detail')}</label><textarea id=rp rows=5></textarea><button onclick="rep(${pend.id},${id})">${t('send_rep')}</button>`:''}</div>`:''}
 ${d.own?`<div class=card><h2>${t('send_exp')}</h2><div class=row><select id=tl>${labs.map(l=>`<option value=${l.id}>${E(l.name)} — ${E(l.wilaya)}</option>`).join('')}</select><input id=tm placeholder="${t('msg')}"></div>${labs.length?`<button onclick="snd(${id})">${t('send_full')}</button>`:`<span class=m>${t('no_exp')}</span>`}</div>`:''}
 <div class=card><h2>${t('expertises')}</h2>${d.referrals.map(r=>`<div style="border-bottom:1px solid var(--b);padding:8px 0">${E(r.from_name)} → <b>${E(r.to_name)}</b> ${tag(r.status)} <span class=m>${D(r.sent_at)}</span><div class=m>${E(r.message)}</div>${(r.report||r.verdict)?`<div><b>${E(r.verdict||'')}</b><br>${E(r.report||'').replace(/\n/g,'<br>')}<div class=m>${D(r.reviewed_at)}</div></div>`:''}</div>`).join('')||`<span class=m>${t('none')}</span>`}</div>`,'cases')},
async inbox(){const c=(await api('/cases')).filter(x=>x.received);shell(`<div class=card><h2>${t('n_inbox')}</h2><table><tr><th>N°</th><th>${t('c_ref')}</th><th>${t('c_stat')}</th><th>${t('c_date')}</th></tr>${c.map(x=>`<tr class=k onclick="go('case',${x.id})"><td>${x.id}</td><td>${E(x.patient_ref)}</td><td>${tag(x.status)}</td><td>${D(x.created)}</td></tr>`).join('')}</table></div>`,'inbox')},
async db(){const cen=ME.role=='central',p=$('#fp')?.value||'',s=$('#fs')?.value||'all',r=await api(`/database?status=${s}&parasite=${encodeURIComponent(p)}`);
 shell(`<div class=card><h2>${t('db_title')}</h2>${cen?`<p class=m>${t('db_central')}</p>`:''}<div class=row>${cen?'':`<div><label>${t('db_status')}</label><select id=fs onchange="V.db()"><option value=all>${t('all')}</option><option value=auto>${t('s_auto')}</option><option value=confirmed>${t('s_conf')}</option></select></div>`}<div><label>${t('db_par')}</label><input id=fp value="${E(p)}" placeholder="${t('filter')}" onchange="V.db()"></div></div><table><tr><th>${t('db_par')}</th><th>${t('db_conf')}</th><th>${t('db_status')}</th><th>${t('db_lab')}</th><th>${t('db_pat')}</th><th>${t('db_exp')}</th><th>${t('db_img')}</th></tr>${r.map(x=>`<tr><td>${E(x.parasite)}</td><td>${pc(x.conf)}</td><td>${tag(x.status)}</td><td>${E(x.lab)}</td><td>${cen?'—':E(x.patient_ref)} ${E(x.age)} ${E(x.sex)}</td><td>${E(x.expert||'')}</td><td>${cen?'':`<a href="${F(x.file_id)}" target=_blank>${t('view')}</a>`}</td></tr>`).join('')}</table></div>`,'db');if($('#fs'))$('#fs').value=s},
async team(){const m=await api('/team');shell(`<div class=card><h2>${t('team_title')}</h2><table>${m.map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.email)}</td><td><span class=tag>${E(x.role)}</span></td></tr>`).join('')}</table></div><div class=card><h3>${t('team_add')}</h3><div class=row><input id=nn placeholder="${t('name')}"><input id=ne type=email placeholder="${t('email')}"><input id=np type=password placeholder="${t('password')} (8+)"><select id=nr><option value=tech>${t('role_tech')}</option>${ME.has_expert?`<option value=expert>${t('role_expert')}</option>`:''}</select></div><div id=err></div><button onclick="au()">${t('add')}</button></div>`,'team')},
/* --- administration centrale --- */
async cdash(){const o=await api('/central/overview'),d=await api('/dataset/stats');shell(`<div class=grid><div class="card kpi"><b>${o.labs_pending}</b><span>${t('ov_labs_p')}</span></div><div class="card kpi"><b>${o.labs_approved}</b><span>${t('ov_labs_a')}</span></div><div class="card kpi"><b>${o.ann_pending}</b><span>${t('ov_ann_p')}</span></div><div class="card kpi"><b>${o.ann_approved}</b><span>${t('ov_ann_a')}</span></div><div class="card kpi"><b>${o.confirmed}</b><span>${t('ov_conf')}</span></div></div>
 <div class=card><h2>${t('ds_title')}</h2><div class=m>${d.images} images · ${d.boxes} ${t('an_title').toLowerCase()}${d.by_class.length?' — '+d.by_class.slice(0,8).map(x=>E(x.label)+' ('+x.n+')').join(', '):''}</div><p><a class=btn href="${API}/api/dataset.zip?t=${T}">⬇ ${t('ds_dl')}</a></p></div>
 <div class=card><h2>${t('ov_conf')}</h2>${bars(o.by_parasite)}</div>`,'cdash')},
async clabs(){const l=await api('/central/labs');shell(`<div class=card><h2>${t('lb_title')}</h2><table><tr><th>${t('lab_name')}</th><th>${t('type')}</th><th>${t('wilaya')}</th><th>${t('lb_admin')}</th><th>${t('c_stat')}</th><th></th></tr>${l.map(x=>`<tr><td>${E(x.name)} ${x.has_expert?`<span class=tag>${t('lb_exp')}</span>`:''}<div class=m>${E(x.address||'')} ${E(x.phone||'')}</div></td><td>${E(x.type)}</td><td>${E(x.wilaya)}</td><td>${E(x.admin_email||'')}</td><td>${tag(x.status)}</td><td>${x.status!='approved'?`<button onclick="lrev(${x.id},'approve')">${t('lb_approve')}</button> `:''}${x.status=='pending'?`<button class=r onclick="lrev(${x.id},'reject')">${t('lb_reject')}</button>`:''}${x.status=='approved'?`<button class=s onclick="lrev(${x.id},'suspend')">${t('lb_suspend')}</button>`:''}${x.status=='approved'?` <button class=s onclick="lexp(${x.id},${x.has_expert?'false':'true'})">${x.has_expert?t('lb_noexp'):t('lb_setexp')}</button>`:''}</td></tr>`).join('')}</table></div>`,'clabs')},
async cann(){const a=await api('/central/annotations?review=pending');shell(`<div class=card><h2>${t('n_cann')}</h2><table><tr><th>${t('an_th_file')}</th><th>${t('an_th_lab')}</th><th>${t('an_th_exp')}</th><th>${t('an_th_lab2')}</th><th>${t('an_th_n')}</th><th>${t('au_when')}</th><th></th></tr>${a.map(x=>`<tr><td>#${x.file_id}</td><td>${E(x.lab)}</td><td>${E(x.expert||'')}</td><td>${(x.labels||'').split(',').map(p=>`<span class=tag>${E(p)}</span>`).join('')}</td><td>${x.boxes}</td><td>${D(x.created)}</td><td><button class=s onclick="openAnn(${x.file_id},true)">${t('view')}</button> <button onclick="arev(${x.file_id},'approve')">${t('approve')}</button> <button class=r onclick="arev(${x.file_id},'reject')">${t('rejectA')}</button></td></tr>`).join('')||`<tr><td colspan=7 class=m>${t('nodata')}</td></tr>`}</table></div>`,'cann')},
async caud(){const a=await api('/central/audit');shell(`<div class=card><h2>${t('n_caud')}</h2><table><tr><th>${t('au_when')}</th><th>${t('au_who')}</th><th>${t('db_lab')}</th><th>${t('au_act')}</th><th>${t('au_tgt')}</th></tr>${a.map(x=>`<tr><td>${D(x.ts)}</td><td>${E(x.name||'')}<div class=m>${E(x.email||'')}</div></td><td>${E(x.lab||'')}</td><td>${E(x.action)}</td><td>${E(x.target)}</td></tr>`).join('')}</table></div>`,'caud')}};
/* ---------- actions ---------- */
async function doLogin(){try{const r=await api('/login',{body:{email:v('#e'),password:v('#p')}});T=r.token;localStorage.dap=T;boot()}catch(e){}}
async function doReg(){try{const r=await api('/register',{body:{lab_name:v('#ln'),type:v('#lt'),wilaya:v('#lw'),phone:v('#lp'),address:v('#la'),has_expert:$('#lx').checked,name:v('#un'),email:v('#ue'),password:v('#up')}});$('#err').textContent='';$('#ok').textContent=r.message}catch(e){}}
async function mk(){try{const r=await api('/cases',{body:{patient_ref:v('#pr'),age:v('#pa'),sex:v('#ps'),sample_type:v('#pt'),notes:v('#pn')}});go('case',r.id)}catch(e){}}
function prev(){const b=$('#rs');b.innerHTML='';[...$('#fl').files].forEach(f=>{const u=URL.createObjectURL(f),x=f.type.startsWith('image')?`<img src="${u}">`:f.type.startsWith('video')?`<video src="${u}" muted controls></video>`:`<div style="font-size:30px">📄</div>`;b.insertAdjacentHTML('beforeend',`<div style="text-align:center">${x}<div class=m>${E(f.name)}</div></div>`)})}
async function up(id){if(!$('#fl').files.length){err(t('choose'));return}const f=new FormData();[...$('#fl').files].forEach(x=>f.append('files',x));$('#ld').textContent=t('analyzing');$('#bt').disabled=true;try{await api(`/cases/${id}/files`,{body:f});go('case',id)}catch(e){$('#ld').textContent='';$('#bt').disabled=false}}
async function snd(id){try{await api(`/cases/${id}/refer`,{body:{to_lab:+v('#tl'),message:v('#tm')}});go('case',id)}catch(e){}}
async function rep(rid,id){if(!v('#vd').trim()){err(t('e_concl'));return}const fs=[...document.querySelectorAll('input[type=radio]:checked')].map(x=>({id:+x.name.slice(1),status:x.value}));try{await api(`/referrals/${rid}/report`,{body:{verdict:v('#vd'),report:v('#rp'),findings:fs}});go('case',id)}catch(e){}}
async function au(){try{await api('/users',{body:{name:v('#nn'),email:v('#ne'),password:v('#np'),role:v('#nr')}});alert(t('added'));V.team()}catch(e){}}
async function lrev(id,a){try{await api(`/central/labs/${id}/review`,{body:{action:a}});V.clabs()}catch(e){}}
async function lexp(id,v){try{await api(`/central/labs/${id}/expert`,{body:{value:v}});V.clabs()}catch(e){}}
async function arev(fid,a){try{await api(`/central/files/${fid}/review`,{body:{action:a}});$('#md')?.remove();V.cann()}catch(e){}}
/* ---------- éditeur d'annotation (expert) / visionneuse (centrale) ---------- */
function opts(sel){const c=CL,o=a=>a.map(n=>`<option ${n==sel?'selected':''}>${E(n)}</option>`).join('');return `<optgroup label="${t('g_model')}">${o(c.model)}</optgroup><optgroup label="${t('g_extra')}">${o(c.extra)}</optgroup><optgroup label="${t('g_other')}">${o(c.other)}</optgroup>`}
async function openAnn(fid,ro){if(!CL)CL=await api('/classes');const ex=await api(`/files/${fid}/annotations`);const img=new Image();img.onload=()=>{
 const W=img.naturalWidth,H=img.naturalHeight,s=Math.min(1,Math.min(900,innerWidth-60)/W);
 let bx=ex.map(e=>({label:e.label,x0:e.x0*W,y0:e.y0*H,x1:e.x1*W,y1:e.y1*H}));
 if(!bx.length&&!ro&&CASE)bx=CASE.findings.filter(x=>x.file_id==fid&&x.status!='rejected').map(x=>{const b=JSON.parse(x.box);return{label:x.parasite,x0:b[0],y0:b[1],x1:b[2],y1:b[3]}});
 AN={fid,img,W,H,s,bx,sel:-1,drag:null,last:CL.model[0],ro};
 $('#md')?.remove();
 document.body.insertAdjacentHTML('beforeend',`<div id=md><div class=in><div><canvas id=cv width=${Math.round(W*s)} height=${Math.round(H*s)}></canvas>${ro?'':`<div class=m>${t('an_hint')}</div>`}</div><div class=side><h3>${t('an_title')}</h3><div id=bl></div><p>${ro?`<button onclick="arev(${fid},'approve')">${t('approve')}</button> <button class=r onclick="arev(${fid},'reject')">${t('rejectA')}</button> `:`<button onclick="saveAnn()">💾 ${t('an_save')}</button> `}<button class=s onclick="closeAnn()">${t('close')}</button></p><div id=an-ok class=m></div></div></div></div>`);
 const cv=$('#cv'),pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width/AN.s,(e.clientY-r.top)*cv.height/r.height/AN.s]};
 if(!ro){cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);AN.drag=pos(e).concat(pos(e))};
 cv.onpointermove=e=>{if(AN.drag){const p=pos(e);AN.drag[2]=p[0];AN.drag[3]=p[1];draw()}};
 cv.onpointerup=e=>{const d=AN.drag;AN.drag=null;if(d&&Math.abs(d[2]-d[0])*AN.s>8&&Math.abs(d[3]-d[1])*AN.s>8){AN.bx.push({label:AN.last,x0:Math.min(d[0],d[2]),y0:Math.min(d[1],d[3]),x1:Math.max(d[0],d[2]),y1:Math.max(d[1],d[3])});AN.sel=AN.bx.length-1}list();draw()}}
 list();draw()};img.src=FR(fid)}
function closeAnn(){$('#md')?.remove();if(AN.saved&&!AN.ro&&CASE)go('case',CASE.case.id)}
function draw(){const cv=$('#cv'),x=cv.getContext('2d'),s=AN.s;x.drawImage(AN.img,0,0,cv.width,cv.height);x.lineWidth=2;x.font='13px sans-serif';
 AN.bx.forEach((b,i)=>{x.strokeStyle=i==AN.sel?'#f59e0b':'#22d3ee';x.strokeRect(b.x0*s,b.y0*s,(b.x1-b.x0)*s,(b.y1-b.y0)*s);x.fillStyle=x.strokeStyle;x.fillText((i+1)+' '+b.label,b.x0*s+2,Math.max(12,b.y0*s-4))});
 if(AN.drag){const d=AN.drag;x.strokeStyle='#f59e0b';x.strokeRect(d[0]*s,d[1]*s,(d[2]-d[0])*s,(d[3]-d[1])*s)}}
function list(){$('#bl').innerHTML=AN.bx.map((b,i)=>AN.ro?`<div class=bx><b>${i+1}</b> ${E(b.label)}</div>`:`<div class=bx><b>${i+1}</b><select onchange="AN.bx[${i}].label=AN.last=this.value;AN.sel=${i};draw()">${opts(b.label)}</select><button class="s" onclick="AN.bx.splice(${i},1);AN.sel=-1;list();draw()">✕</button></div>`).join('')||`<span class=m>${t('an_none')}</span>`}
async function saveAnn(){const{W,H}=AN;try{const r=await api(`/files/${AN.fid}/annotations`,{body:{boxes:AN.bx.map(b=>({label:b.label,box:[b.x0/W,b.y0/H,b.x1/W,b.y1/H]}))}});AN.saved=true;$('#an-ok').textContent='✅ '+t('an_saved').replace('{n}',r.saved)}catch(e){}}
/* ---------- démarrage ---------- */
async function boot(){if(!T)return V.login();try{ME=await api('/me')}catch(e){return}const def=ME.role=='central'?'cdash':'dash',[h,id]=(location.hash.slice(1)||def).split('/');const ok=ME.role=='central'?['cdash','clabs','cann','db','caud']:['dash','cases','new','case','inbox','db','team'];go(ok.includes(h)?h:def,id)}
boot();
</script></body></html>
